<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAI-90</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: #f5f4f0;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────── */
    #sidebar {
      width: 256px;
      min-width: 256px;
      background: #1a1a1a;
      color: #d4d4d4;
      display: flex;
      flex-direction: column;
      transition: width 0.2s, min-width 0.2s;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 48px; min-width: 48px; }

    .sb-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      flex-shrink: 0;
    }

    #toggle-btn {
      background: none;
      border: none;
      color: #d4d4d4;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 6px;
      flex-shrink: 0;
      line-height: 1;
      border-radius: 4px;
    }
    #toggle-btn:hover { background: #2a2a2a; color: #fff; }

    .sb-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    #new-chat-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 8px 8px;
      padding: 8px 10px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #d4d4d4;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      white-space: nowrap;
      overflow: hidden;
      flex-shrink: 0;
    }
    #new-chat-btn:hover { background: #333; color: #fff; }

    .sb-label {
      font-size: 11px;
      color: #666;
      padding: 6px 14px 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 0 8px;
    }
    #chat-list::-webkit-scrollbar { width: 4px; }
    #chat-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      cursor: pointer;
      border-radius: 5px;
      margin: 1px 6px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      user-select: none;
    }
    .chat-item:hover { background: #2a2a2a; }
    .chat-item.active { background: #2e2e2e; color: #fff; }

    .chat-pin { font-size: 10px; flex-shrink: 0; }
    .chat-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }

    /* hide text when collapsed */
    #sidebar.collapsed .sb-title,
    #sidebar.collapsed .sb-new-label,
    #sidebar.collapsed .sb-label,
    #sidebar.collapsed .chat-name,
    #sidebar.collapsed .chat-pin { display: none; }
    #sidebar.collapsed #new-chat-btn { justify-content: center; padding: 8px; margin: 4px auto 8px; width: 36px; }

    /* ── Context Menu ─────────────────────────── */
    #ctx-menu {
      position: fixed;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 7px;
      padding: 4px 0;
      z-index: 999;
      min-width: 148px;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .ctx-row {
      padding: 8px 14px;
      font-size: 13px;
      color: #d4d4d4;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Courier New', Courier, monospace;
    }
    .ctx-row:hover { background: #383838; color: #fff; }
    .ctx-row.danger { color: #c87070; }
    .ctx-row.danger:hover { background: #3a2020; }

    /* ── Main ─────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat-header {
      padding: 13px 20px 11px;
      border-bottom: 1px solid #ddd;
      background: #f5f4f0;
      flex-shrink: 0;
    }
    #chat-header h1 { font-size: 15px; letter-spacing: 1px; }
    #chat-header p  { font-size: 11px; color: #777; margin-top: 3px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    .msg { display: flex; flex-direction: column; max-width: 78%; }
    .msg.user      { align-self: flex-end;   align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.65;
    }
    .msg.user .bubble {
      background: #1a1a1a;
      color: #f0f0f0;
      border-bottom-right-radius: 3px;
    }
    .msg.assistant .bubble {
      background: #fff;
      border: 1px solid #e0e0e0;
      color: #1a1a1a;
      border-bottom-left-radius: 3px;
    }

    .msg-time {
      font-size: 10px;
      color: #aaa;
      margin-top: 4px;
      padding: 0 2px;
    }

    /* status badge */
    .sbadge {
      display: inline-block;
      padding: 1px 10px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .sbadge-GREEN   { background: #e6f4e6; color: #2d9e2d; border: 1px solid #2d9e2d; }
    .sbadge-YELLOW  { background: #fef8e6; color: #c98a00; border: 1px solid #e6a817; }
    .sbadge-RED     { background: #fce8e8; color: #cc2222; border: 1px solid #cc2222; }
    .sbadge-UNKNOWN { background: transparent; color: #666; border: 1px solid #999; }

    /* ── Input area ───────────────────────────── */
    .input-wrap {
      padding: 10px 20px 14px;
      background: #f5f4f0;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
    }
    .input-hint {
      font-size: 11px;
      color: #999;
      margin-bottom: 6px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #msg-input {
      flex: 1;
      padding: 9px 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      background: #fff;
      outline: none;
      line-height: 1.5;
    }
    #msg-input:focus { border-color: #888; }
    #send-btn {
      padding: 9px 18px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
      height: 40px;
    }
    #send-btn:hover { background: #333; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sb-header">
    <button id="toggle-btn" title="메뉴 열기/닫기">&#9776;</button>
    <span class="sb-title">MAI-90</span>
  </div>
  <button id="new-chat-btn" onclick="newChat()">
    <span>&#43;</span>
    <span class="sb-new-label">새 채팅</span>
  </button>
  <div class="sb-label">채팅</div>
  <div id="chat-list"></div>
</aside>

<!-- Context Menu -->
<div id="ctx-menu">
  <div class="ctx-row" id="ctx-pin"    onclick="ctxPin()">📌 <span id="ctx-pin-label">고정</span></div>
  <div class="ctx-row" id="ctx-rename" onclick="ctxRename()">✏️ 이름 변경</div>
  <div class="ctx-row" id="ctx-share"  onclick="ctxShare()">↗ 공유</div>
  <div class="ctx-row danger"           onclick="ctxDelete()">🗑 삭제</div>
</div>

<!-- Main -->
<main id="main">
  <div id="chat-header">
    <h1 id="chat-title">MAI-90</h1>
    <p>Maintenance &amp; Analysis Intelligence &mdash; industrial safety support</p>
  </div>
  <div id="messages"></div>
  <div class="input-wrap">
    <div class="input-hint">파일 경로(.txt) 입력 → 수집 &nbsp;|&nbsp; 장비명 입력 → 상태 조회</div>
    <div class="input-row">
      <textarea id="msg-input" rows="1" placeholder="파일 경로 또는 장비명 입력..."></textarea>
      <button id="send-btn" onclick="sendMsg()">전송</button>
    </div>
  </div>
</main>

<script>
// ── Storage helpers ──────────────────────────────────────────────────────
let sessions = JSON.parse(localStorage.getItem('mai90') || '[]');
let currentId = null;
let ctxId = null;

function save() { localStorage.setItem('mai90', JSON.stringify(sessions)); }
function get(id) { return sessions.find(s => s.id === id); }

// ── Boot ─────────────────────────────────────────────────────────────────
if (sessions.length === 0) {
  newChat(false);
} else {
  currentId = sessions[0].id;
  renderSidebar();
  renderMessages();
}

// ── New chat ─────────────────────────────────────────────────────────────
function newChat(focus = true) {
  const id = String(Date.now());
  sessions.unshift({ id, name: '새 채팅', messages: [], pinned: false });
  save();
  currentId = id;
  renderSidebar();
  renderMessages();
  pushMsg('assistant', 'MAI-90입니다.<br>파일 경로(.txt)를 보내시면 데이터를 수집하고,<br>장비명을 보내시면 안전 상태를 조회합니다.');
  if (focus) document.getElementById('msg-input').focus();
}

// ── Load chat ────────────────────────────────────────────────────────────
function loadChat(id) {
  currentId = id;
  renderSidebar();
  const s = get(id);
  document.getElementById('chat-title').textContent = s ? s.name : 'MAI-90';
  renderMessages();
  if (s && s.messages.length === 0) {
    pushMsg('assistant', 'MAI-90입니다.<br>파일 경로(.txt)를 보내시면 데이터를 수집하고,<br>장비명을 보내시면 안전 상태를 조회합니다.');
  }
}

// ── Render sidebar ───────────────────────────────────────────────────────
function renderSidebar() {
  const pinned   = sessions.filter(s => s.pinned);
  const unpinned = sessions.filter(s => !s.pinned);
  const ordered  = [...pinned, ...unpinned];

  document.getElementById('chat-list').innerHTML = ordered.map(s => `
    <div class="chat-item ${s.id === currentId ? 'active' : ''}"
         onclick="loadChat('${s.id}')"
         oncontextmenu="showCtx(event,'${s.id}')">
      ${s.pinned ? '<span class="chat-pin">📌</span>' : ''}
      <span class="chat-name">${esc(s.name)}</span>
    </div>`).join('');
}

// ── Render messages ──────────────────────────────────────────────────────
function renderMessages() {
  const s = get(currentId);
  const el = document.getElementById('messages');
  el.innerHTML = s ? s.messages.map(bubbleHtml).join('') : '';
  el.scrollTop = el.scrollHeight;
}

function bubbleHtml(m) {
  const t = new Date(m.ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  return `<div class="msg ${m.role}">
    <div class="bubble">${m.html}</div>
    <div class="msg-time">${t}</div>
  </div>`;
}

function pushMsg(role, html) {
  const s = get(currentId);
  if (!s) return;
  const m = { role, html, ts: new Date().toISOString() };
  // auto-name from first user message
  if (role === 'user' && s.name === '새 채팅') {
    const plain = html.replace(/<[^>]+>/g, '');
    s.name = plain.slice(0, 26) + (plain.length > 26 ? '…' : '');
    document.getElementById('chat-title').textContent = s.name;
    renderSidebar();
  }
  s.messages.push(m);
  save();

  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.innerHTML = bubbleHtml(m);
  el.appendChild(div.firstElementChild);
  el.scrollTop = el.scrollHeight;
  return m;
}

function replaceLastBubble(html) {
  const s = get(currentId);
  if (!s || s.messages.length === 0) return;
  s.messages[s.messages.length - 1].html = html;
  save();
  const el = document.getElementById('messages');
  const last = el.lastElementChild;
  if (last) last.querySelector('.bubble').innerHTML = html;
}

// ── Send ─────────────────────────────────────────────────────────────────
async function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  pushMsg('user', esc(text));
  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  try {
    const isPath = text.includes('.txt') || /[/\\]/.test(text);
    if (isPath) await doIngest(text);
    else         await doStatus(text);
  } catch (e) {
    pushMsg('assistant', '오류: ' + esc(e.message));
  }

  btn.disabled = false;
  input.focus();
}

async function doIngest(filePath) {
  pushMsg('assistant', '"' + esc(filePath) + '" 수집 중…');
  try {
    const res  = await fetch('/api/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filePath }),
    });
    const data = await res.json();
    if (!res.ok) { replaceLastBubble('수집 실패: ' + esc(data.error || res.statusText)); return; }
    replaceLastBubble(
      '수집 완료<br><br>' +
      '처리 ' + data.processed + '건 &nbsp;|&nbsp; ' +
      '저장 ' + data.inserted  + '건 &nbsp;|&nbsp; ' +
      '격리 ' + data.quarantined + '건 &nbsp;|&nbsp; ' +
      '보류 ' + data.held + '건 &nbsp;|&nbsp; ' +
      '거부 ' + data.rejected + '건'
    );
  } catch (e) {
    replaceLastBubble('수집 실패: ' + esc(e.message));
  }
}

async function doStatus(subject) {
  try {
    const res  = await fetch('/api/status?subject=' + encodeURIComponent(subject));
    const data = await res.json();
    if (!res.ok) { pushMsg('assistant', '조회 실패: ' + esc(data.error || res.statusText)); return; }

    const ev = (data.evidence || []).map(esc).join(', ') || '—';
    pushMsg('assistant',
      '<span class="sbadge sbadge-' + data.status + '">' + esc(data.status) + '</span><br><br>' +
      '<b>장비:</b> ' + esc(data.equipment) + '<br>' +
      '<b>조치:</b> ' + esc(data.action)    + '<br>' +
      '<b>근거:</b> ' + esc(data.reason)    + '<br>' +
      '<b>출처:</b> <span style="font-size:11px;color:#777">' + ev + '</span>'
    );
  } catch (e) {
    pushMsg('assistant', '조회 실패: ' + esc(e.message));
  }
}

// ── Input auto-resize + Enter to send ────────────────────────────────────
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.getElementById('msg-input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
});

// ── Sidebar toggle ────────────────────────────────────────────────────────
document.getElementById('toggle-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

// ── Context menu ──────────────────────────────────────────────────────────
function showCtx(e, id) {
  e.preventDefault(); e.stopPropagation();
  ctxId = id;
  const s = get(id);
  document.getElementById('ctx-pin-label').textContent = s && s.pinned ? '고정 해제' : '고정';
  const m = document.getElementById('ctx-menu');
  m.style.display = 'block';
  m.style.left    = e.clientX + 'px';
  m.style.top     = e.clientY + 'px';
}
document.addEventListener('click', () => { document.getElementById('ctx-menu').style.display = 'none'; });

function ctxPin() {
  const s = get(ctxId); if (!s) return;
  s.pinned = !s.pinned; save(); renderSidebar();
}
function ctxRename() {
  const s = get(ctxId); if (!s) return;
  const name = prompt('새 이름:', s.name);
  if (name && name.trim()) {
    s.name = name.trim(); save(); renderSidebar();
    if (ctxId === currentId) document.getElementById('chat-title').textContent = s.name;
  }
}
function ctxShare() {
  const s = get(ctxId); if (!s) return;
  const text = s.messages
    .map(m => '[' + (m.role === 'user' ? '사용자' : 'MAI-90') + '] ' + m.html.replace(/<[^>]+>/g,''))
    .join('\n\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('대화 내용이 클립보드에 복사됐습니다.'));
  } else { alert(text); }
}
function ctxDelete() {
  if (!confirm('이 채팅을 삭제하시겠습니까?')) return;
  sessions = sessions.filter(s => s.id !== ctxId); save();
  if (currentId === ctxId) {
    if (sessions.length === 0) newChat(false);
    else { currentId = sessions[0].id; loadChat(currentId); }
  } else renderSidebar();
}

// ── XSS escape ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
