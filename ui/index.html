<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAI-90</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f3f8f2;
      --panel:     #ffffff;
      --border:    #cddacb;
      --text:      #1a1a1a;
      --muted:     #5a6e58;
      --btn-bg:    #3a5c3a;
      --btn-hover: #2d4a2d;
      --btn-txt:   #ffffff;
      --green:     #2d9e2d;
      --yellow:    #e6a817;
      --red:       #cc2222;
      --radius:    5px;
      --skel:      #ddeadb;
      --skel-hi:   #c8dcc6;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────── */
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px 12px;
    }
    header h1 { font-size: 16px; letter-spacing: 2px; }
    header p  { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: 0.3px; }

    /* ── Layout ─────────────────────────────── */
    main {
      max-width: 780px;
      margin: 28px auto;
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ── Panel ──────────────────────────────── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
    }
    .panel-title {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Drop zone ──────────────────────────── */
    #drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 14px;
      transition: border-color 0.15s, background 0.15s;
    }
    #drop-zone:hover,
    #drop-zone:focus,
    #drop-zone.drag-over {
      border-color: var(--btn-bg);
      background: #ecf4eb;
      outline: none;
    }
    #drop-zone .dz-icon { font-size: 26px; margin-bottom: 6px; }
    #drop-zone .dz-text { font-size: 13px; color: var(--muted); }
    #drop-zone .dz-sub  { font-size: 11px; color: #9aac98; margin-top: 3px; }

    /* ── File chip ──────────────────────────── */
    #file-chip {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      margin-bottom: 12px;
      width: fit-content;
      max-width: 100%;
    }
    #chip-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #chip-clear {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    #chip-clear:hover { color: var(--red); }

    /* ── Button row ─────────────────────────── */
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ── Buttons ────────────────────────────── */
    .btn {
      padding: 9px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      line-height: 1.2;
    }
    .btn:focus-visible { outline: 2px solid var(--btn-bg); outline-offset: 2px; }

    .btn-primary { background: var(--btn-bg); color: var(--btn-txt); }
    .btn-primary:hover:not(:disabled) { background: var(--btn-hover); }
    .btn-primary:disabled { background: #a0b29e; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-outline:hover:not(:disabled) { background: var(--bg); color: var(--text); border-color: #aac0a8; }
    .btn-outline:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Status text ────────────────────────── */
    .status-line {
      font-size: 12px;
      min-height: 18px;
      margin-top: 12px;
      color: var(--muted);
    }
    .status-line.ok  { color: var(--green); }
    .status-line.err { color: var(--red); }

    /* ── Skeleton ───────────────────────────── */
    .skeleton {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .skeleton.show { display: flex; }
    .skel-bar {
      height: 13px;
      border-radius: 3px;
      background: linear-gradient(
        90deg,
        var(--skel) 0%, var(--skel) 30%,
        var(--skel-hi) 50%,
        var(--skel) 70%, var(--skel) 100%
      );
      background-size: 250% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skel-bar { animation: none; background: var(--skel); }
    }

    /* ── Ingest counts ──────────────────────── */
    #ingest-counts { display: none; margin-top: 16px; }
    .counts {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .count-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
    }
    .count-num { font-size: 22px; line-height: 1; }
    .count-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
    .count-item.c-inserted .count-num    { color: var(--green); }
    .count-item.c-quarantined .count-num { color: var(--yellow); }
    .count-item.c-held .count-num        { color: #b08800; }
    .count-item.c-rejected .count-num    { color: var(--red); }

    /* ── Equipment section ──────────────────── */
    .field-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 180px;
    }
    .field label { font-size: 11px; color: var(--muted); }
    .field input {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.12s;
      width: 100%;
    }
    .field input:focus { border-color: var(--btn-bg); }

    .subject-hint {
      font-size: 11px;
      color: #9aac98;
      margin-top: 5px;
    }

    /* ── Result ─────────────────────────────── */
    #result {
      display: none;
      margin-top: 16px;
      animation: fadein 0.22s ease;
    }
    #result.show { display: block; }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: none; }
    }

    .result-block {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }
    .r-row {
      display: flex;
      gap: 10px;
      padding: 4px 0;
      font-size: 13px;
      line-height: 1.55;
    }
    .r-lbl {
      width: 44px;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 11px;
      padding-top: 1px;
      letter-spacing: 0.3px;
    }
    .r-val { flex: 1; word-break: break-word; }
    .r-sources { font-size: 11px; color: #888; }

    /* ── Status badges ──────────────────────── */
    .sbadge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .sbadge-GREEN   { background: #e6f4e6; color: var(--green); border: 1px solid var(--green); }
    .sbadge-YELLOW  { background: #fef8e6; color: #c08c00; border: 1px solid var(--yellow); }
    .sbadge-RED     { background: #fce8e8; color: var(--red); border: 1px solid var(--red); }
    .sbadge-UNKNOWN { background: transparent; color: #666; border: 1px solid #999; }

    /* ── Mobile ─────────────────────────────── */
    @media (max-width: 540px) {
      main { margin: 14px auto; gap: 16px; }
      .panel { padding: 14px 16px; }
      .btn-row { flex-direction: column; align-items: stretch; }
      .btn { text-align: center; }
      .field-row { flex-direction: column; align-items: stretch; }
      .field { min-width: 0; }
    }
  </style>
</head>
<body>

<!-- Drag & drop overlay -->
<div id="drop-overlay" role="status" aria-label="파일 드롭 영역" style="
  display:none; position:fixed; inset:0;
  background:rgba(42,74,42,0.72);
  z-index:200; align-items:center; justify-content:center;
  flex-direction:column; gap:12px; pointer-events:none;">
  <div style="font-size:44px;">📂</div>
  <div style="font-size:17px;color:#fff;letter-spacing:1px;">파일을 여기에 놓으세요</div>
  <div style="font-size:11px;color:#b8d8b6;">.txt &middot; .json 지원</div>
</div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept=".txt,.json" style="display:none"
       aria-label="파일 선택">

<header>
  <h1>MAI-90</h1>
  <p>Maintenance &amp; Analysis Intelligence &mdash; industrial safety support</p>
</header>

<main>

  <!-- ── Panel 1: Data Ingestion ── -->
  <section class="panel" aria-label="데이터 수집">
    <div class="panel-title">데이터 수집</div>

    <div id="drop-zone" role="button" tabindex="0" aria-label="파일 선택 또는 드래그 앤 드롭">
      <div class="dz-icon">📂</div>
      <div class="dz-text">파일을 끌어다 놓거나 클릭해서 선택하세요</div>
      <div class="dz-sub">.txt &middot; .json</div>
    </div>

    <div id="file-chip" aria-label="선택된 파일">
      <span id="chip-name"></span>
      <button type="button" id="chip-clear" onclick="clearFile()" aria-label="파일 선택 취소">✕</button>
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-outline" id="attach-btn">📎 파일 선택</button>
      <button type="button" class="btn btn-outline" id="sample-btn" onclick="ingestSample()">샘플 사용</button>
      <button type="button" class="btn btn-primary" id="ingest-btn" onclick="doIngest()">수집 시작</button>
    </div>

    <div id="ingest-status" class="status-line" aria-live="polite"></div>

    <div class="skeleton" id="ingest-skel">
      <div class="skel-bar" style="width:58%"></div>
      <div class="skel-bar" style="width:38%"></div>
      <div class="skel-bar" style="width:68%"></div>
    </div>

    <div id="ingest-counts">
      <div class="counts">
        <div class="count-item">
          <span class="count-num" id="cnt-processed">—</span>
          <span class="count-lbl">처리</span>
        </div>
        <div class="count-item c-inserted">
          <span class="count-num" id="cnt-inserted">—</span>
          <span class="count-lbl">저장</span>
        </div>
        <div class="count-item c-quarantined">
          <span class="count-num" id="cnt-quarantined">—</span>
          <span class="count-lbl">격리</span>
        </div>
        <div class="count-item c-held">
          <span class="count-num" id="cnt-held">—</span>
          <span class="count-lbl">보류</span>
        </div>
        <div class="count-item c-rejected">
          <span class="count-num" id="cnt-rejected">—</span>
          <span class="count-lbl">거부</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Panel 2: Equipment Status ── -->
  <section class="panel" aria-label="장비 상태 조회">
    <div class="panel-title">장비 상태 조회</div>

    <div class="field-row">
      <div class="field">
        <label for="subject-input">장비명</label>
        <input type="text" id="subject-input" list="subject-list"
               placeholder="예: Cooling pump #3" autocomplete="off">
        <datalist id="subject-list"></datalist>
      </div>
      <button type="button" class="btn btn-primary" id="status-btn" onclick="doStatus()">조회</button>
    </div>
    <div id="subject-hint" class="subject-hint" aria-live="polite"></div>

    <div id="status-msg" class="status-line" aria-live="polite"></div>

    <div class="skeleton" id="status-skel">
      <div class="skel-bar" style="width:50%"></div>
      <div class="skel-bar" style="width:72%"></div>
      <div class="skel-bar" style="width:58%"></div>
      <div class="skel-bar" style="width:62%"></div>
    </div>

    <div id="result">
      <div class="result-block">
        <div class="r-row">
          <span class="r-lbl">장비</span>
          <span class="r-val" id="r-equipment"></span>
        </div>
        <div class="r-row">
          <span class="r-lbl">상태</span>
          <span class="r-val" id="r-status"></span>
        </div>
        <div class="r-row">
          <span class="r-lbl">조치</span>
          <span class="r-val" id="r-action"></span>
        </div>
        <div class="r-row">
          <span class="r-lbl">근거</span>
          <span class="r-val" id="r-reason"></span>
        </div>
        <div class="r-row">
          <span class="r-lbl">출처</span>
          <span class="r-val r-sources" id="r-evidence"></span>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
'use strict';

let pendingFile = null;

// ── Equipment list from /api/records ───────────────────────────────────────
async function refreshEquipmentList() {
  try {
    const res = await fetch('/api/records');
    if (!res.ok) return;
    const records = await res.json();
    const subjects = [...new Set(records.map(r => r.subject).filter(Boolean))].sort();
    const dl = document.getElementById('subject-list');
    dl.innerHTML = subjects.map(s => `<option value="${esc(s)}">`).join('');
    const hint = document.getElementById('subject-hint');
    hint.textContent = subjects.length === 0
      ? '수집된 장비 없음'
      : '수집된 장비 ' + subjects.length + '개';
  } catch (_) {}
}

// ── File handling ──────────────────────────────────────────────────────────
function setFile(file) {
  pendingFile = file;
  document.getElementById('chip-name').textContent = '📎 ' + file.name;
  document.getElementById('file-chip').style.display = 'flex';
}
function clearFile() {
  pendingFile = null;
  document.getElementById('file-chip').style.display = 'none';
  document.getElementById('chip-name').textContent = '';
  document.getElementById('file-input').value = '';
}

// Drop zone & file picker
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('click', () => document.getElementById('file-input').click());
dropZone.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    document.getElementById('file-input').click();
  }
});
document.getElementById('attach-btn').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) setFile(file);
});

// ── Drag & Drop ────────────────────────────────────────────────────────────
let dragDepth = 0;
const overlay = document.getElementById('drop-overlay');

document.addEventListener('dragenter', e => {
  if (!e.dataTransfer.types.includes('Files')) return;
  dragDepth++;
  overlay.style.display = 'flex';
  dropZone.classList.add('drag-over');
});
document.addEventListener('dragleave', () => {
  dragDepth--;
  if (dragDepth <= 0) {
    dragDepth = 0;
    overlay.style.display = 'none';
    dropZone.classList.remove('drag-over');
  }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  overlay.style.display = 'none';
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
});

// ── Ingest helpers ─────────────────────────────────────────────────────────
function setIngestBusy(busy) {
  document.getElementById('ingest-btn').disabled = busy;
  document.getElementById('sample-btn').disabled = busy;
  document.getElementById('attach-btn').disabled = busy;
  document.getElementById('ingest-skel').classList.toggle('show', busy);
}
function setIngestStatus(msg, cls) {
  const el = document.getElementById('ingest-status');
  el.textContent = msg;
  el.className = 'status-line' + (cls ? ' ' + cls : '');
}
function showCounts(data) {
  document.getElementById('cnt-processed').textContent   = data.processed;
  document.getElementById('cnt-inserted').textContent    = data.inserted;
  document.getElementById('cnt-quarantined').textContent = data.quarantined;
  document.getElementById('cnt-held').textContent        = data.held;
  document.getElementById('cnt-rejected').textContent    = data.rejected;
  document.getElementById('ingest-counts').style.display = 'block';
}

// ── Ingest: uploaded file ──────────────────────────────────────────────────
async function doIngest() {
  if (!pendingFile) {
    setIngestStatus('파일을 먼저 선택하세요.', 'err');
    return;
  }
  setIngestBusy(true);
  setIngestStatus('수집 중…', '');
  document.getElementById('ingest-counts').style.display = 'none';
  try {
    const fd = new FormData();
    fd.append('file', pendingFile);
    const res  = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) {
      setIngestStatus('수집 실패: ' + esc(data.error || res.statusText), 'err');
    } else {
      showCounts(data);
      setIngestStatus('수집 완료', 'ok');
      clearFile();
      await refreshEquipmentList();
    }
  } catch (e) {
    setIngestStatus('수집 실패: ' + esc(e.message), 'err');
  } finally {
    setIngestBusy(false);
  }
}

// ── Ingest: sample data ────────────────────────────────────────────────────
async function ingestSample() {
  setIngestBusy(true);
  setIngestStatus('샘플 수집 중…', '');
  document.getElementById('ingest-counts').style.display = 'none';
  try {
    const res  = await fetch('/api/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filePath: './sample-data/sample.txt' }),
    });
    const data = await res.json();
    if (!res.ok) {
      setIngestStatus('수집 실패: ' + esc(data.error || res.statusText), 'err');
    } else {
      showCounts(data);
      setIngestStatus('샘플 수집 완료', 'ok');
      await refreshEquipmentList();
    }
  } catch (e) {
    setIngestStatus('수집 실패: ' + esc(e.message), 'err');
  } finally {
    setIngestBusy(false);
  }
}

// ── Status query ───────────────────────────────────────────────────────────
async function doStatus() {
  const subject = document.getElementById('subject-input').value.trim();
  if (!subject) {
    document.getElementById('status-msg').textContent = '장비명을 입력하세요.';
    document.getElementById('status-msg').className = 'status-line err';
    return;
  }

  const btn = document.getElementById('status-btn');
  btn.disabled = true;
  document.getElementById('status-skel').classList.add('show');
  document.getElementById('status-msg').textContent = '조회 중…';
  document.getElementById('status-msg').className = 'status-line';

  try {
    const res  = await fetch('/api/status?subject=' + encodeURIComponent(subject));
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('status-msg').textContent =
        '조회 실패: ' + esc(data.error || res.statusText);
      document.getElementById('status-msg').className = 'status-line err';
    } else {
      document.getElementById('status-msg').textContent = '';
      document.getElementById('status-msg').className = 'status-line';
      renderResult(data);
    }
  } catch (e) {
    document.getElementById('status-msg').textContent = '조회 실패: ' + esc(e.message);
    document.getElementById('status-msg').className = 'status-line err';
  } finally {
    document.getElementById('status-skel').classList.remove('show');
    btn.disabled = false;
  }
}

function renderResult(data) {
  const st = data.status || 'UNKNOWN';
  document.getElementById('r-equipment').textContent = data.equipment || '—';
  document.getElementById('r-status').innerHTML =
    `<span class="sbadge sbadge-${esc(st)}">${esc(st)}</span>`;
  document.getElementById('r-action').textContent   = data.action   || '—';
  document.getElementById('r-reason').textContent   = data.reason   || '—';
  document.getElementById('r-evidence').textContent =
    (data.evidence || []).join(', ') || '—';

  // restart fade-in animation
  const el = document.getElementById('result');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

// ── Keyboard shortcut ──────────────────────────────────────────────────────
document.getElementById('subject-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doStatus();
});

// ── Escape helper ──────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Init ───────────────────────────────────────────────────────────────────
refreshEquipmentList();
</script>
</body>
</html>
